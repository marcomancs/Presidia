<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presidia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: transparent;                 /* finestra frameless+trasparente → angoli stondati reali */
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select:none; user-select:none;
    cursor: default;
  }
  /* la "card" è la finestra visibile: angoli arrotondati + ombra morbida */
  .card {
    position:absolute; inset:18px;
    border-radius:22px; overflow:hidden;
    background: radial-gradient(130% 120% at 50% 28%, #ffffff 0%, #eef2f6 72%, #e2e8ee 100%);
    /* ombra morbida e uniforme (alone diffuso, niente stacco netto) */
    box-shadow: 0 8px 28px rgba(16,61,94,.16), 0 1px 3px rgba(16,61,94,.10);
    display:flex; align-items:center; justify-content:center;
    animation: fadein .45s ease both;
  }
  #logo {
    width:200px; max-width:60%; height:auto; display:block;
    animation: rise .7s cubic-bezier(.22,.9,.32,1) both;
    -webkit-user-drag:none;
  }
  /* sottile barra di caricamento indeterminata in basso (dentro gli angoli stondati) */
  .bar {
    position:absolute; left:0; right:0; bottom:0;
    height:3px; overflow:hidden; background: rgba(16,61,94,.08);
  }
  .bar::before {
    content:""; position:absolute; top:0; bottom:0; left:-40%; width:40%;
    background: linear-gradient(90deg, rgba(16,61,94,0), #103D5E 50%, rgba(16,61,94,0));
    animation: slide 1.35s cubic-bezier(.65,0,.35,1) infinite;
  }
  /* Windows: la finestra È la card (424x264, angoli stondati dalla regione Win32) */
  body.win { background:#eef2f6; }
  body.win .card { inset:0; border-radius:0; box-shadow: inset 0 0 0 1px rgba(16,61,94,.14); }
  @keyframes fadein { from{opacity:0} to{opacity:1} }
  @keyframes rise {
    from{ opacity:0; transform: translateY(10px) scale(.985); }
    to  { opacity:1; transform: translateY(0)    scale(1);     }
  }
  @keyframes slide { 0%{ left:-40%; } 100%{ left:100%; } }
</style>
</head>
<body>
  <div class="card">
    <img id="logo" src="Logo_stone.png" alt="Stone Safety">
    <div class="bar"></div>
  </div>
<script>if (/Windows/i.test(navigator.userAgent)) document.body.classList.add('win');</script>
</body>
</html>
